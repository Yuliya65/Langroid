name: Lint

on:
  push:
    branches: 
      - main 
  pull_request:
    branches: 
      - main 

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11  # Replace with your desired Python version

      - name: Install uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7
        with:
          enable-cache: true


      - name: Install project dependencies with uv
        run: uv sync

      - name: Run black
        run: |
          uv run black --check .

      - name: Install ruff
        uses: chartboost/ruff-action@v1

      - name: Run mypy
        run: |
          uv run mypy -p langroid

